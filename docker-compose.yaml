services:
  app:
    container_name: app
    image: tiagogarciaferreira/snake-catalog:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      SSL_KEY_STORE: file:/run/secrets/snake_catalog_tls_keystore
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public_key
      JWT_PRIVATE_KEY: file:/run/secrets/jwt_private_key
      SPRING_SQL_INIT_DATA_LOCATIONS: file:/app/db/data/seed_tb_snakes.sql,file:/app/db/data/seed_tb_users.sql
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/db/migration
      LOG_CONFIG_PATH: file:/app/config/logback-spring.xml
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${SERVER_PORT:-8443}:${SERVER_PORT:-8443}"
    volumes:
      - ./src/main/resources/db/data/seed_tb_snakes.sql:/app/db/data/seed_tb_snakes.sql:ro
      - ./src/main/resources/db/data/seed_tb_users.sql:/app/db/data/seed_tb_users.sql:ro
      - ./src/main/resources/db/migration:/app/db/migration:ro
      - ./src/main/resources/logback-spring.xml:/app/config/logback-spring.xml:ro
      - ./logs:/app/logs:rw
    secrets:
      - snake_catalog_tls_keystore
      - jwt_public_key
      - jwt_private_key
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/localhost/8443" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - snakes-net

  postgres:
    container_name: postgres
    image: postgres:17.1-alpine
    restart: unless-stopped
    shm_size: 64mb
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - snakes-net

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.enable-lifecycle"
      - "--log.level=warn"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "${PROMETHEUS_PORT:-9090}" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - snakes-net

  grafana:
    container_name: grafana
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:${GRAFANA_PORT:-3000}"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/Snake_Catalog_Dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GRAFANA_PORT:-3000}/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - snakes-net

volumes:
  postgres_data:
    name: postgres_data
    driver: local
  prometheus_data:
    name: prometheus_data
    driver: local
  grafana_data:
    name: grafana_data
    driver: local

networks:
  snakes-net:
    driver: bridge

secrets:
  snake_catalog_tls_keystore:
    file: ./certs/snake-catalog-tls-keystore.p12
  jwt_public_key:
    file: ./jwt/jwt-public-key.jwk
  jwt_private_key:
    file: ./jwt/jwt-private-key.jwk